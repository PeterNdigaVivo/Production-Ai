events { worker_connections 4096; }
http {
  server_tokens off;
  client_max_body_size 16m;

  upstream backend  { server backend:8000; }
  upstream frontend { server frontend:3000; }

  # HTTP -> HTTPS
  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/production-ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/production-ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Internal service endpoints are never reachable from outside.
    location ~* /_internal(/|$) { return 404; }

    location /api/ { proxy_pass http://backend; }
    location /ws/  {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 600s;
    }
    location / { proxy_pass http://frontend; }
  }
}
