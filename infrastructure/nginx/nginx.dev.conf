events { worker_connections 1024; }
http {
  upstream backend  { server backend:8000; }
  upstream frontend { server frontend:3000; }

  server {
    listen 80;

    # Refuse any external request to internal service endpoints. The
    # video-ingestion/tracking-engine services hit these on the compose
    # network directly (http://backend:8000), bypassing nginx.
    location ~* /_internal(/|$) { return 404; }

    location /api/ { proxy_pass http://backend; proxy_set_header Host $host; }
    location /ws/  { proxy_pass http://backend; proxy_http_version 1.1;
                     proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
    location /metrics { proxy_pass http://backend; }
    location /health  { proxy_pass http://backend; }
    location /        { proxy_pass http://frontend; }
  }
}
