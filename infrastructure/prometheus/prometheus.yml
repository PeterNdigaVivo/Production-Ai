global:
  scrape_interval: 15s

scrape_configs:
  - job_name: backend
    metrics_path: /metrics
    static_configs: [{ targets: ["backend:8000"] }]

  - job_name: detection-engine
    static_configs: [{ targets: ["detection-engine:9100"] }]

  - job_name: tracking-engine
    static_configs: [{ targets: ["tracking-engine:9100"] }]

  - job_name: video-ingestion
    static_configs: [{ targets: ["video-ingestion:9100"] }]

  - job_name: event-engine
    static_configs: [{ targets: ["event-engine:9100"] }]
